<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        .container_main {
            background-color: black;
            height: 100vh;
            padding-top: 50px;

        }

        .todo_main {
            max-width: 500px;
            height: auto;
            background-color: white;
            border-radius: 10px;
            margin: auto;

        }
        .todo_item{
            display: flex;
            align-items: center ;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgb(206, 206, 206);
        }
        .todo_item p {
            margin-bottom: 0 !important;
        }
        .completed{
           text-decoration: line-through;
        }
    </style>
</head>

<body>
    <div class="container_main">
        <div class="todo_main p-3">
            <h1 class="h4 text-primary text-center">My Tasks</h1>

            <div class="input-group mb-3">
                <input id="input" type="text" class="form-control" placeholder="Enter a new task..."
                    aria-label="Recipient's username" aria-describedby="button-addon2">
                <button class="btn btn-primary" type="button" id="addTodo">Add</button>
            </div>

            <div>
                <ul id="list" class="list-unstyled">
                    <!-- <li class="todo_item">
                        <p>Simple Task</p>
                        <div>
                            <button class="btn btn-primary btn-sm"><i class="fa-solid fa-pen-to-square"></i> Edit</button>
                            <button class="btn btn-danger btn-sm"><i class="fa-solid fa-trash"></i> Delete</button>
                        </div>
                    </li> -->
                    
                </ul>
            </div>
        </div>

    </div>

    <script src="./app.js"></script>

</body>

</html>
